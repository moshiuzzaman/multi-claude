name: Report a bug
description: Something doesn't work? Tell us in a few words.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: A sentence or two is enough. You can drag a screenshot in here too (hide emails and names first; this page is public).
      placeholder: "I clicked Launch on my Work account and nothing opened."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (optional)
      description: Filled in for you when you report from the app.
  - type: input
    id: os
    attributes:
      label: Computer (optional)
      description: Filled in for you when you report from the app.
