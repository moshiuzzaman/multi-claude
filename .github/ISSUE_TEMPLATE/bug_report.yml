name: Report a bug
description: Something doesn't work? Tell us in a few words.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: A sentence or two is enough. What did you do, and what happened?
      placeholder: "I clicked Launch on my Work account and nothing opened."
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag an image or video here, or paste it. Hide emails and names first; this page is public.
  - type: input
    id: version
    attributes:
      label: Version (optional)
      description: Filled in for you when you report from the app.
  - type: input
    id: os
    attributes:
      label: Computer (optional)
      description: Filled in for you when you report from the app.
