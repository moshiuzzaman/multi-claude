name: Bug report
description: Something in Multi-Claude doesn't work as it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **leave out emails, account names and file paths
        with your name in them**: this page is public.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
      placeholder: "I clicked Launch on my Work account and…"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Multi-Claude
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Multi-Claude version
      description: Shown at the bottom of the sidebar (for example 2.8.1).
      placeholder: "2.8.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Installer (Setup .exe)
        - Portable .exe
        - Mac (.dmg)
        - Running from source (npm start)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2 / macOS 15.2"
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Desktop version (if it matters)
      description: Claude → Help → About.
      placeholder: "1.4.2"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or log
      description: |
        Drag images here. For a log, run with `MULTI_CLAUDE_DEBUG=1`
        (see docs/GUIDE.md) and paste the relevant lines.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before sending
      options:
        - label: I removed emails, account names and personal paths from this report.
          required: true
