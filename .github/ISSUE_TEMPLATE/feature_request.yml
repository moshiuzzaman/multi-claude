name: Suggest an idea
description: Something Multi-Claude could do better? We'd love to hear it.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Multi-Claude to do? A sentence or two is enough.
      placeholder: "It would be great if I could…"
    validations:
      required: true
  - type: textarea
    id: picture
    attributes:
      label: Picture or sketch (optional)
      description: Drag an image here if it helps explain the idea.
  - type: input
    id: version
    attributes:
      label: Version (optional)
      description: Filled in for you when you suggest from the app.
